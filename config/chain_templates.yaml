# 链路模板配置
chain_templates:
  version: "1.0"
  templates:
    - name: "支付流水链路"
      trigger_type: "支付流水号"
      start_type: "payment"
      nodes:
        - id: "payment"
          table: "pay_create"
          query_field: "pay_no"
          output_fields: ["pay_no", "order_no", "channel_id", "amount", "status"]
          next_nodes: ["order", "channel"]

        - id: "order"
          table: "orders"
          query_field: "order_no"
          output_fields: ["order_no", "member_id", "status"]
          next_nodes: []

        - id: "channel"
          table: "channel_config"
          query_field: "channel_id"
          output_fields: ["channel_id", "channel_name"]
          next_nodes: []

      time_window:
        before_minutes: 5
        after_minutes: 10

    - name: "订单号链路"
      trigger_type: "订单号"
      start_type: "order"
      nodes:
        - id: "order"
          table: "orders"
          query_field: "order_no"
          output_fields: ["order_no", "member_id", "pay_no", "status"]
          next_nodes: ["payment"]

        - id: "payment"
          table: "pay_create"
          query_field: "order_no"
          output_fields: ["pay_no", "channel_id", "status"]
          next_nodes: []

      time_window:
        before_minutes: 10
        after_minutes: 15

    - name: "退款链路"
      trigger_type: "退款单号"
      start_type: "refund"
      nodes:
        - id: "refund"
          table: "refund_create"
          query_field: "refund_no"
          output_fields: ["refund_no", "pay_no", "order_no", "status"]
          next_nodes: ["payment"]

        - id: "payment"
          table: "pay_create"
          query_field: "pay_no"
          output_fields: ["pay_no", "order_no", "channel_id", "status"]
          next_nodes: []

      time_window:
        before_minutes: 5
        after_minutes: 60

    - name: "会员链路"
      trigger_type: "会员ID"
      start_type: "member"
      nodes:
        - id: "member"
          table: "member"
          query_field: "member_id"
          output_fields: ["member_id", "name", "status"]
          next_nodes: []

      time_window:
        before_minutes: 30
        after_minutes: 30