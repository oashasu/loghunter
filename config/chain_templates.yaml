# 链路模板配置
chain_templates:
  version: "1.0"
  templates:
    - name: "支付流水链路"
      trigger_type: "支付流水号"
      nodes:
        - id: "payment"
          table: "pay_create"
          query_field: "pay_no"
          output_fields: ["pay_no", "order_no", "channel_id", "amount", "status"]
          next_nodes: ["order", "channel"]

        - id: "order"
          table: "orders"
          query_field: "order_no"
          output_fields: ["order_no", "member_id", "status"]
          next_nodes: []

        - id: "channel"
          table: "channel_config"
          query_field: "channel_id"
          output_fields: ["channel_id", "channel_name"]
          next_nodes: []

      time_window:
        before_minutes: 5
        after_minutes: 10

    - name: "订单号链路"
      trigger_type: "订单号"
      nodes:
        - id: "order"
          table: "orders"
          query_field: "order_no"
          output_fields: ["order_no", "member_id", "pay_no", "status"]
          next_nodes: ["payment"]

        - id: "payment"
          table: "pay_create"
          query_field: "order_no"
          output_fields: ["pay_no", "channel_id", "status"]
          next_nodes: []

      time_window:
        before_minutes: 10
        after_minutes: 15