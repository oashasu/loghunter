# 根因推测规则
root_cause_rules:
  version: "1.0"
  rules:
    - exception_type: "ChannelTimeoutException"
      possible_causes:
        - cause: "渠道服务响应延迟"
          keywords: ["timeout", "超时"]
          confidence: 0.85
        - cause: "网络连接不稳定"
          keywords: ["network", "网络"]
          confidence: 0.7
        - cause: "渠道服务不可用"
          keywords: ["unavailable", "不可用"]
          confidence: 0.9
      suggestions:
        - "检查渠道服务状态"
        - "检查网络连接"
        - "检查渠道超时配置"

    - exception_type: "PaymentFailedException"
      possible_causes:
        - cause: "支付参数错误"
          keywords: ["参数错误", "invalid"]
          confidence: 0.8
        - cause: "渠道返回失败"
          keywords: ["渠道返回", "failed"]
          confidence: 0.85
        - cause: "余额不足"
          keywords: ["余额不足", "balance"]
          confidence: 0.75
      suggestions:
        - "检查支付参数"
        - "检查渠道返回码"
        - "检查用户余额"